<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QA Data Studio AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #f9fafb;
      color: #111827;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    .status {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
      text-align: center;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 10px;
      background: white;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }
    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a10 10 0 1 0 10 10H12V2Z"/>
      <path d="M12 12 2.1 7.1"/>
      <path d="M12 12l9.9 4.9"/>
    </svg>
    QA Data Studio
  </h1>

  <div class="toggle-container">
    <span class="toggle-label">Smart Form Filler</span>
    <button id="fill-form-btn" class="btn" style="width: auto; margin-bottom: 0;">Fill Now</button>
  </div>

  <button id="inspector-btn" class="btn">Start Locator Inspector</button>
  <button id="recorder-btn" class="btn">Start AI Test Recorder</button>
  
  <div id="status" class="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
