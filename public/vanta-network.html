<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanta Network Background</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* CSS fallback gradient if CDN fails */
            background: linear-gradient(135deg, #09090b 0%, #1a1a2e 100%);
        }
        #vanta-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="vanta-canvas"></div>

    <script>
        let vantaEffect = null;
        
        // Helper to load scripts with Promise and crossorigin
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.crossOrigin = "anonymous";
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                document.head.appendChild(script);
            });
        }

        // Initialize Vanta with retry logic
        async function initVanta(retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    if (!window.THREE) {
                        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js");
                    }
                    if (!window.VANTA || !window.VANTA.NET) {
                        await loadScript("https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js");
                    }

                    if (window.VANTA && window.VANTA.NET) {
                        vantaEffect = window.VANTA.NET({
                            el: "#vanta-canvas",
                            mouseControls: true,
                            touchControls: true,
                            gyroControls: false,
                            minHeight: 200.00,
                            minWidth: 200.00,
                            scale: 1.00,
                            scaleMobile: 1.00,
                            color: 0x7c3aed, // Purple/Primary color
                            backgroundColor: 0x000000, 
                            backgroundAlpha: 0.0, // Transparent to let Aurora shine through
                            points: 12.00, // Less chaotic, more minimal
                            maxDistance: 22.00,
                            spacing: 18.00,
                            showDots: true
                        });
                        return; // Successfully initialized
                    }
                } catch (error) {
                    console.error(`Vanta load attempt ${i + 1} failed:`, error);
                    if (i < retries - 1) {
                        await new Promise(resolve => setTimeout(resolve, 1000)); // wait 1s before retry
                    }
                }
            }
            console.error("Failed to initialize Vanta after multiple attempts. Using fallback gradient.");
        }

        // Initialize when DOM is ready
        document.addEventListener("DOMContentLoaded", () => {
            initVanta();
        });

        // Handle messages for mouse movement and scroll from the parent window
        window.addEventListener('message', (event) => {
            if (!vantaEffect) return;
            
            if (event.data && event.data.type === 'mousemove') {
                // event.data.x and y are normalized between -1 and 1
                // convert them back to absolute pixel coordinates for this iframe
                const clientX = (event.data.x + 1) / 2 * window.innerWidth;
                const clientY = (-(event.data.y) + 1) / 2 * window.innerHeight;
                
                // Vanta tracks mousemove on window or container. Let's dispatch a fake event.
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: clientX,
                    clientY: clientY,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(mouseEvent);
            }
        });
    </script>
</body>
</html>
