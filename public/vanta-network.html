<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanta Network Background</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #09090b; /* matches zinc-950 / dark mode */
        }
        #vanta-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="vanta-canvas"></div>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- Load Vanta Net -->
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    
    <script>
        let vantaEffect = null;
        
        function initVanta() {
            if (window.VANTA && window.VANTA.NET) {
                vantaEffect = window.VANTA.NET({
                    el: "#vanta-canvas",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 1.00,
                    color: 0x7c3aed, // Purple/Primary color
                    backgroundColor: 0x09090b, // Dark background
                    points: 12.00, // Less chaotic, more minimal
                    maxDistance: 22.00,
                    spacing: 18.00,
                    showDots: true
                });
            }
        }

        // Initialize when DOM is ready
        document.addEventListener("DOMContentLoaded", () => {
            initVanta();
        });

        // Handle messages for mouse movement and scroll from the parent window
        window.addEventListener('message', (event) => {
            if (!vantaEffect) return;
            
            if (event.data && event.data.type === 'mousemove') {
                // event.data.x and y are normalized between -1 and 1
                // convert them back to absolute pixel coordinates for this iframe
                const clientX = (event.data.x + 1) / 2 * window.innerWidth;
                const clientY = (-(event.data.y) + 1) / 2 * window.innerHeight;
                
                // Vanta tracks mousemove on window or container. Let's dispatch a fake event.
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: clientX,
                    clientY: clientY,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(mouseEvent);
            }
        });
    </script>
</body>
</html>
